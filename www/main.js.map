export default "<nav *ngIf=\"logueado\" class=\"navbar navbar-expand-md {{tipoNav}} {{colorBarra}} border-bottom shadow\">\n    <a class=\"navbar-brand {{colorLetraBarra}}\" routerLink=\"/\">\n      <img src=\"./assets/{{logo}}\" width=\"30\" height=\"30\" class=\"d-inline-block align-top \" alt=\"\">\n      {{title}}\n    </a>\n    <button class=\"navbar-toggler float-left\" type=\"button\" data-toggle=\"collapse\" data-target=\"#navbarSupportedContent\" aria-controls=\"navbarSupportedContent\" aria-expanded=\"false\" aria-label=\"Toggle navigation\">\n        <i class=\"fa fa-bars text-white\" aria-hidden=\"true\"></i>\n    </button>\n    <div class=\"collapse navbar-collapse\" id=\"navbarSupportedContent\">\n\n        <ul class=\"navbar-nav mr-auto\">\n            <li class=\"nav-item\" *ngFor=\"let sec of detalleMenu\">\n                <a class=\"nav-link colorLetraBarra\" [routerLink]=\"sec.path\" routerLinkActive=\"active\">{{sec.nombre}}</a>\n            </li>\n        </ul>\n\n        <!--form class=\"form-inline my-2 my-lg-0\">\n            <input class=\"form-control mr-sm-2\" type=\"buscar\" placeholder=\"buscar\" aria-label=\"buscar\">\n            <button class=\"btn btn-outline-success my-2 my-sm-0\" type=\"submit\">buscar</button>\n        </form-->\n    </div>\n\n  </nav>\n  <app-amsnoticias></app-amsnoticias>\n  <div class=\"container d-block d-sm-none\">\n    <div class=\"accordion\" id=\"accordion\">\n      <div class=\"card {{colorMenu}} p-0 m-0\">\n        <div *ngFor=\"let sec of detalleMenu\" class=\"card-header p-1\" id=\"heading\">\n\n          <button class=\"btn btn-link collapsed {{colorFuenteMenu}}\"\n            type=\"button\" data-toggle=\"collapse\"\n            data-target=\"#collapseVarones\" aria-expanded=\"true\"\n            aria-controls=\"collapseVarones\" [routerLink]=\"sec.path\">\n            <h5 class=\"\">\n              <i id=\"iconVarones\" class=\"{{sec.foto}} {{colorIconoMenu}} {{colorFondoIconoMenu}} {{paddingFondoIconoMenu}} badge-pill\"></i>\n              {{sec.nombre}}\n            </h5>\n          </button>\n        </div>\n        <div id=\"collapseVarones\" class=\"collapse\"\n          aria-labelledby=\"headingVaron\" data-parent=\"#accordion\">\n\n          <div class=\"card-body\">\n\n\n          </div>\n        </div>\n      </div>\n\n    </div>\n\n</div>\n";
