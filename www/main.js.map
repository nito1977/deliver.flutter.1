export default "<div class=\"table-responsive p-0\">\n\n  <p class=\"Titulo\">Eventos del partido</p>\n  <table class=\"table table-sm\">\n\n    <thead class=\"thead-white\">\n      <tr>\n        <th></th>\n        <th>Apellido</th>\n\n        <th class=\"text-center\">Club</th>\n        <th class=\"text-center\">H.</th>\n        <th class=\"text-center\">T.</th>\n\n      </tr>\n    </thead>\n\n    <tbody>\n      <tr *ngFor=\"let t of detallePartido\">\n        <td *ngIf=\"determinaEvento(t.estado)\">\n          <img  src=\"./assets/imagenes/{{eventoimg}}\" alt=\"gol\" longdesc=\"gol mediosweb\"></td>\n          <td>{{t.Apellido}}, {{t.nomjuga}}</td>\n\n        <td class=\"text-center\">{{t.Nombreclub}}</td>\n        <td class=\"text-center\">{{t.mingol}}:{{t.seggol}}</td>\n        <td class=\"text-center\">{{t.tiempo}}</td>\n      </tr>\n      <!--\n      <tr>\n        <td>\n          <img src=\"./assets/imagenes/amarilla.jpg\" alt=\"gol\" longdesc=\"gol mediosweb\"></td>\n        <td><strong>RECABARREN CANTO, GABRIEL CRUZ</strong></td>\n\n        <td class=\"text-center\">CJR</td>\n        <td class=\"text-center\"><strong>0:0</strong></td>\n        <td class=\"text-center\">0</td>\n      </tr>\n      <tr>\n        <td>\n          <img src=\"./assets/imagenes/azul.jpg\" alt=\"gol\" longdesc=\"gol mediosweb\"></td>\n        <td><strong>RECABARREN CANTO, GABRIEL CRUZ</strong></td>\n\n        <td class=\"text-center\">CJR</td>\n        <td class=\"text-center\"><strong>0:0</strong></td>\n        <td class=\"text-center\">0</td>\n      </tr>\n      <tr>\n        <td>\n          <img src=\"./assets/imagenes/roja.jpg\" alt=\"gol\" longdesc=\"gol mediosweb\"></td>\n        <td><strong>RECABARREN CANTO, GABRIEL CRUZ</strong></td>\n\n        <td class=\"text-center\">CJR</td>\n        <td class=\"text-center\"><strong>0:0</strong></td>\n        <td class=\"text-center\">0</td>\n      </tr>\n      -->\n    </tbody>\n  </table>\n</div>\n";
