export default "<!--p>\n  Campeonato: {{idCamp}} {{nCamp}}\n  div: {{idDiv}}\n  fecha: {{idFec}}\n  zona: {{idZon}}\n  Instancia: {{idIns}}\n  boletin: {{idBol}}\n<p-->\n<app-loader *ngIf=\"!buscando\"></app-loader>\n<div class=\"table-responsive\">\n  <table class=\"table\">\n    <thead class=\"thead\">\n      <tr class=\"table-info\">\n                <!--<th>id</th>-->\n                <th>Fecha</th>\n                <th class=\"text-center\" colspan=\"2\">Loc.</th>\n                <th class=\"text-center\">Res.</th>\n                <th class=\"text-center\" colspan=\"2\">Vis.</th>\n                <th>Zo</th>\n                <th>Est</th>\n                <th>Ver</th>\n                <!--<th>Admin</th>-->\n      </tr>\n    </thead>\n    <tbody>\n        <tr *ngFor=\"let t of detalleTabla\">\n            <td class=\"mr-0 pr-0\">{{t.fechapartido}}</td>\n            <td class=\"mr-0 pr-0 pl-0 ml-0\"><img class=\"logoclub mr-0 pr-0\" src='./assets/logos/clubes/{{t.l}}.jpg'/></td>\n            <td class=\"text-center mr-0 pr-0 pl-0 ml-0\">{{t.loc}}</td>\n            <td class=\"text-center mr-0 pr-0 pl-0 ml-0\">\n              <span *ngIf=\"determinaGanador('loc', t.id, t.TantosLoc, t.TantosVis);\" class='{{ganaloc}}'>\n                {{t.TantosLoc}}\n              </span> -\n              <span *ngIf=\"determinaGanador('vis', t.id, t.TantosLoc, t.TantosVis);\" class='{{ganavis}}'>\n                {{t.TantosVis}}\n              </span>\n            </td>\n            <td class=\"text-center mr-0 pr-0 pl-0 ml-0\">{{t.visitante}}</td>\n            <td><img class=\"logoclub pl-0 mr-0\" src='./assets/logos/clubes/{{t.v}}.jpg'/></td>\n            <td class=\"text-center mr-0 pr-0 pl-0 ml-0\">{{t.zona}}</td>\n            <td class=\"mr-0 pr-0 pl-0 ml-0\">{{t.estado}}</td>\n            <td class=\"pl-0 ml-0\">\n              <a type='button' value='Ver' routerLink=\"/partido/{{t.id}}\"\n                >\n                <i class=\"fa fa-angle-right pr-2 pl-2\" aria-hidden=\"true\"></i>\n              </a>\n            </td>\n\n        </tr>\n    </tbody>\n  </table>\n</div>\n";
