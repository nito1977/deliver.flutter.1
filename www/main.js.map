export default "  <app-loader *ngIf=\"buscando\"></app-loader>\n<nav class=\"nav nav-pills flex-column flex-sm-row padd-r-2\">\n  <div class=\"btn-group btn-block mb-2\" role=\"group\">\n    <button id=\"btnGroupDrop1\" type=\"button\" class=\"btn btn-info dropdown-toggle rounded-0\" data-toggle=\"dropdown\" aria-haspopup=\"true\" aria-expanded=\"false\">\n    Boletin {{bolSel}} Año {{anioSel}}\n    </button>\n    <div class=\"dropdown-menu btn btn-block\" aria-labelledby=\"btnGroupAnio\">\n\n      <a *ngFor=\"let b of detalleBoletines\" class=\"dropdown-item \" href=\"#\" (click)=\"cargaBoletines(b.anio, b.id);\" >Boletín {{b.nombre}} Año {{b.anio\n      }}</a>\n\n    </div>\n  </div>\n</nav>\n<div class=\"accordion padd-r-2\" id=\"accordionExample\">\n  <div class=\"card\"  *ngFor=\"let item of detalleCamp\">\n    <div class=\"card-header p-2\" id=\"{{item.id}}\">\n      <h2 class=\"mb-0\">\n      <button (click)=\"irDetallePartidos('/partido', item.divi, item.id, item.zona, item.fecha, item.Boletin, item.id)\" class=\"btn btn-link w-100\" type=\"button\" data-toggle=\"collapse\" [attr.data-target]=\"'#collapse' + item.id + 'div' + item.divi + 'fec' + item.Fecha + 'zo' + item.zona\"  [attr.aria-controls]=\"'collapse' + item.id + 'div' + item.divi\">\n          <div class=\"row p-0\">\n            <div class=\"col-12 col-md-12 p-0 pl-2\"><h5>{{item.nombre}}</h5></div>\n            <div class=\"col-12 col-md-12 p-0 \">\n              Fecha <span class=\"badge badge-primary\">{{item.Fecha}}</span>\n              División <span class=\"badge badge-primary\">{{item.categ}}</span>\n              Zona <span class=\"badge badge-primary\">{{item.zona}}</span>\n            </div>\n          </div>\n        </button>\n      </h2>\n    </div>\n\n    <div id=\"collapse{{item.id}}div{{item.divi}}fec{{item.Fecha}}zo{{item.zona}}\" class=\"collapse\" [attr.aria-labelledby]=\"'heading' + item.id + 'div' + item.divi + 'fec' + item.Fecha + 'zo' + item.zona\" data-parent=\"#accordionExample\">\n      <div class=\"card-body p-0\">\n        <app-partidoslist  [idCamp]= \"item.id\" [nCamp]=\"item.nombre\" [idDiv]=\"item.divi\" [idFec]=\"item.Fecha\" [idZon]=\"item.zona\" [idBol]=\"item.boletin\" ></app-partidoslist>\n        <!--<div class=\"table responsive\">\n          <table class=\"table\" id=\"DataTables_Table_1\" >\n\n            <thead>\n              <tr>\n                <!--<th>id</th>\n                <th>Fecha</th>\n                <th class=\"text-center\" colspan=\"2\">Loc.</th>\n                <th class=\"text-center\">Res.</th>\n                <th class=\"text-center\" colspan=\"2\">Vis.</th>\n\n                <th>Zo</th>\n                <th>Est</th>\n                <th>Ver</th>\n                <!--<th>Admin</th>\n              </tr>\n            </thead>\n            <tbody>\n              <tr>\n                <!--<td>37600</td>\n\n                <td>2020-03-11</td>\n                <td><img class=\"logoclub\" src=\"/assets/logos/clubes/61.jpg\"></td>\n                <td>MDO</td>\n                <td class=\"text-center bg-info\">0 - 0</td>\n                <td>DUE</td>\n                <td><img class=\"logoclub\" src=\"/assets/logos/clubes/3.jpg\"></td>\n                <td>A</td>\n                <th>Com.\n                </th>\n                <td>\n                  <a class=\"btn btn-warning\" value=\"Detalle\"\n                    onclick=\"window.open('../Ver_detalle_partido.php?partido=37600')\">\n                    <i class=\"fa fa-th-list\" aria-hidden=\"true\"></i>\n                  </a>\n                </td>\n                <!--<td>\n                  <a class=\"btn btn-info\"\n                    onclick=\"window.open('modificar_arbitros.php?partido=37600&amp;fecha=1&amp;cate=&amp;camp=122')\">\n                    <i class=\"fa fa-gavel\" aria-hidden=\"true\"></i>\n                  </a>\n                  <a class=\"btn btn-success\"\n                    onclick=\"window.open('modificar_partido.php?partido=37600&amp;fecha=1&amp;cate=&amp;camp=122')\">\n                    <i class=\"fa fa-pencil-square-o\" aria-hidden=\"true\"></i>\n                  </a>\n                </td>\n              </tr>\n              <tr>\n                <!--<td>37598</td>\n\n                <td>2020-03-11</td>\n                <td><img class=\"logoclub\" src=\"logos/clubes/4.jpg\"></td>\n                <td>OPC</td>\n                <td class=\"text-center bg-info\">0 - 0</td>\n                <td>LDR</td>\n                <td><img class=\"logoclub\" src=\"logos/clubes/6.jpg\"></td>\n                <td>A</td>\n                <th>Com.\n                </th>\n                <td>\n                  <a class=\"btn btn-warning\" value=\"Detalle\"\n                    onclick=\"window.open('../Ver_detalle_partido.php?partido=37598')\">\n                    <i class=\"fa fa-th-list\" aria-hidden=\"true\"></i>\n                  </a>\n                </td>\n                <!--<td>\n                  <a class=\"btn btn-info\"\n                    onclick=\"window.open('modificar_arbitros.php?partido=37598&amp;fecha=1&amp;cate=&amp;camp=122')\">\n                    <i class=\"fa fa-gavel\" aria-hidden=\"true\"></i>\n                  </a>\n                  <a class=\"btn btn-success\"\n                    onclick=\"window.open('modificar_partido.php?partido=37598&amp;fecha=1&amp;cate=&amp;camp=122')\">\n                    <i class=\"fa fa-pencil-square-o\" aria-hidden=\"true\"></i>\n                  </a>\n                </td>\n              </tr>\n            </tbody>\n          </table>\n        </div>-->\n\n      </div>\n    </div>\n  </div>\n</div>\n";
