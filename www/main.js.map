export default "<div class=\" text-center\">\n  <div class=\"alert alert-danger\" role=\"alert\" *ngIf=\"estatus\">\n    {{tituloEstatus}}\n    <button type=\"button\" class=\"close\" data-dismiss=\"alert\" aria-label=\"Close\">\n      <span aria-hidden=\"true\">&times;</span>\n    </button>\n  </div>\n\n    <form #loguinForm=\"ngForm\" (ngSubmit)=\"ngSubmit();\"\n      class=\"form-signin colorFondoLogin colorLetraLogin\">\n      <img class=\"mb-4\" src=\"../../assets/logoams.png\" alt=\"\" width=\"72\" height=\"72\">\n      <h5 class=\"colorFondoLogin colorLetraLogin p-2 m-0\"> {{titulo}}</h5>\n      <div>\n        <label>Login</label>\n        <input type=\"text\" #nombre=\"ngModel\" [(ngModel)]=\"user.nombre\"\n          name=\"nombre\" class=\"form-control\" autocomplete=\"off\"\n          maxlength=\"11\" minlength=\"0\" numbers-only\n          type=\"text\" required autofocus/>\n        <p *ngIf=\"nombre.touched && !nombre.valid\"\n          class=\"alert alert-danger p-1\" role=\"alert\">\n          El login es obligatorio\n        </p>\n      </div>\n      <div>\n        <label>Contraseña</label>\n        <input type=\"password\" #clave=\"ngModel\"\n          [(ngModel)]=\"user.clave\" name=\"clave\"\n          class=\"form-control\" required/>\n        <p *ngIf=\"clave.touched && !clave.valid\"\n          class=\"alert alert-danger p-1\" role=\"alert\">\n          El password es obligatorio\n        </p>\n      </div>\n      <br>\n      <input type=\"submit\" value=\"Acceder\" class=\"btn btn-success\"\n        [disabled]=\"!loguinForm.form.valid\" />\n      <br>\n      <p *ngIf=\"status\" class=\"alert alert-success\">\n        <label>{{mesagge}}</label>\n      </p>\n      <br>\n      <p *ngIf=\"!status && status != null\" class=\"alert alert-danger\">\n        <label>{{mesagge}}</label>\n      </p>\n    </form>\n  <app-loader *ngIf=\"bloquear\"></app-loader>\n</div>\n";
