
<div class="banner-hockey">
  <h2>Equipos</h2>
  <div class="logos-container d-flex flex-wrap justify-content-center">
    <a [routerLink]="['/club',club.idclub]" title="{{club.Nombreclub}}" *ngFor="let club of listado" class="text-center align-items-center">
      <img src="assets/logos/clubes/{{club.idclub}}.png" alt="{{club.Nombreclub}}" class="mx-auto d-block">
      <span class="club-name">{{club.Nombreclub}}</span>
    </a>

  </div>
</div>
