<div *ngIf="isLoading" class="d-flex justify-content-center align-items-center py-5">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
    </div>
</div>

<form *ngIf="!isLoading" [formGroup]="playerForm" (ngSubmit)="onSubmit()" class="player-detail-form p-1">
    <!-- Row 1: License & Document -->
    <div class="row mb-2 g-2">
        <div class="col-md-5">
            <div class="input-group input-group-sm mb-0">
                <span class="input-group-text bg-warning text-white border-0 fw-bold">N° Licencia</span>
                <input type="text" class="form-control border-0 bg-warning-light" formControlName="idnumerocarnet">
            </div>
        </div>
        <div class="col-md-7">
            <div class="input-group input-group-sm mb-0">
                <span class="input-group-text bg-info text-white border-0 fw-bold">N° Documento</span>
                <input type="text" class="form-control border-0 bg-info-light" formControlName="Documento">
            </div>
        </div>
    </div>

    <!-- Row 2: Names -->
    <div class="mb-2">
        <label class="form-label x-small text-muted mb-0">Jugador.</label>
        <div class="row g-2">
            <div class="col-md-6">
                <input type="text" class="form-control form-control-sm bg-light" placeholder="APELLIDO" formControlName="Apellido">
            </div>
            <div class="col-md-6">
                <input type="text" class="form-control form-control-sm bg-light" placeholder="NOMBRE" formControlName="Nombre">
            </div>
        </div>
    </div>

    <!-- Row 3: Birth Date & Club -->
    <div class="row mb-2 g-2">
        <div class="col-md-4">
            <label class="form-label x-small text-muted mb-0">Fecha Nacimiento</label>
            <input type="text" class="form-control form-control-sm bg-light" formControlName="Fecnac" placeholder="mm/dd/yyyy">
        </div>
        <div class="col-md-8">
            <label class="form-label x-small text-muted mb-0">Club Actual</label>
            <input type="text" class="form-control form-control-sm bg-light" formControlName="club">
        </div>
    </div>

    <!-- Row 4: Nationality & Gender -->
    <div class="row mb-2 g-2">
        <div class="col-md-8">
            <label class="form-label x-small text-muted mb-0">Nacionalidad</label>
            <div class="input-group input-group-sm">
                <span class="input-group-text bg-white border-end-0"><i class="fa fa-flag"></i></span>
                <input type="text" class="form-control border-start-0" formControlName="Nacionalidad">
            </div>
        </div>
        <div class="col-md-4">
            <label class="form-label x-small text-muted mb-0">Género</label>
            <div class="input-group input-group-sm">
                <span class="input-group-text bg-white border-end-0"><i class="fa fa-venus-mars"></i></span>
                <input type="text" class="form-control border-start-0" formControlName="Sexo">
            </div>
        </div>
    </div>

    <!-- Row 5: Address -->
    <div class="mb-2">
        <label class="form-label x-small text-muted mb-0">Domicilio</label>
        <div class="input-group input-group-sm">
            <span class="input-group-text bg-white border-end-0"><i class="fa fa-home"></i></span>
            <input type="text" class="form-control border-start-0" formControlName="Domicilio">
        </div>
    </div>

    <!-- Row 6: Location Info -->
    <div class="row mb-2 g-2">
        <div class="col-md-5">
            <label class="form-label x-small text-muted mb-0">Localidad</label>
            <input type="text" class="form-control form-control-sm" formControlName="Localidad">
        </div>
        <div class="col-md-3">
            <label class="form-label x-small text-muted mb-0">Código Postal</label>
            <input type="text" class="form-control form-control-sm" formControlName="CodigoPostal">
        </div>
        <div class="col-md-4">
            <label class="form-label x-small text-muted mb-0">Provincia</label>
            <input type="text" class="form-control form-control-sm" formControlName="Provincia">
        </div>
    </div>

    <!-- Row 7: Phone & Email -->
    <div class="row mb-2 g-2">
        <div class="col-md-5">
            <label class="form-label x-small text-muted mb-0">Teléfono</label>
            <div class="input-group input-group-sm">
                <span class="input-group-text bg-white border-end-0"><i class="fa fa-phone"></i></span>
                <input type="text" class="form-control border-start-0" formControlName="Telefono">
            </div>
        </div>
        <div class="col-md-7">
            <label class="form-label x-small text-muted mb-0">Email</label>
            <div class="input-group input-group-sm">
                <span class="input-group-text bg-white border-end-0"><i class="fa fa-envelope"></i></span>
                <input type="text" class="form-control border-start-0" formControlName="Email">
            </div>
        </div>
    </div>

    <!-- Row 8: Fed, Disc, Act, Branch -->
    <div class="row mb-2 g-2">
        <div class="col-md-3">
            <label class="form-label x-small text-muted mb-0">Federación</label>
            <input type="text" class="form-control form-control-sm" formControlName="Federacion">
        </div>
        <div class="col-md-3">
            <label class="form-label x-small text-muted mb-0">Disciplina</label>
            <div class="input-group input-group-sm">
                <span class="input-group-text bg-white border-end-0 w-auto p-2 px-3"><i class="fa fa-shield"></i></span>
                <input type="text" class="form-control border-start-0" formControlName="Disciplina">
            </div>
        </div>
        <div class="col-md-3">
            <label class="form-label x-small text-muted mb-0">Actividad</label>
            <div class="input-group input-group-sm">
                <span class="input-group-text bg-white border-end-0 w-auto p-2 px-3"><i class="fa fa-id-badge"></i></span>
                <input type="text" class="form-control border-start-0" formControlName="Actividad">
            </div>
        </div>
        <div class="col-md-3">
            <label class="form-label x-small text-muted mb-0">RAMA</label>
            <div class="input-group input-group-sm">
                <span class="input-group-text bg-white border-end-0 w-auto p-2 px-3"><i class="fa fa-list"></i></span>
                <input type="text" class="form-control border-start-0" formControlName="RAMA">
            </div>
        </div>
    </div>

    <!-- Row 9: Health Plan -->
    <div class="mb-3">
        <label class="form-label x-small text-muted mb-0">Obra Social</label>
        <div class="input-group input-group-sm">
            <span class="input-group-text bg-white border-end-0"><i class="fa fa-plus-square"></i></span>
            <input type="text" class="form-control border-start-0" formControlName="ObraSocial">
        </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 font-weight-bold shadow-sm" [disabled]="isSaving">
        <i class="fa" [ngClass]="isSaving ? 'fa-spinner fa-spin' : 'fa-save'"></i>
        {{ isSaving ? ' Guardando...' : ' Guardar Cambios' }}
    </button>
</form>
