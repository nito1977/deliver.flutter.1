<div class="container article-container p-4">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <!-- Article Header -->
      <div class="article-header mb-4 text-center">
        <h1 class="article-title mb-3">{{ listado.titulo }}</h1>
        <div class="article-meta text-muted">
          <span class="mr-3"><i class="fa fa-folder-open mr-1"></i> {{ listado.categoria_nombre }}</span>
          <span><i class="fa fa-calendar mr-1"></i> {{ listado.published | date:'mediumDate' }}</span>
        </div>
      </div>

      <!-- Featured Image -->
      <div class="article-image mb-5" *ngIf="listado.foto1">
        <img [src]="listado.foto1" class="img-fluid rounded shadow-sm w-100" alt="{{ listado.titulo }}">
      </div>

      <!-- Article Content -->
      <div class="article-content">
        <div [innerHTML]="getSanitizedResumen(listado.articulo)"></div>
      </div>
      
      <!-- Back Button (Optional) -->
      <div class="text-center mt-5">
        <a routerLink="/home" class="btn btn-outline-primary"><i class="fa fa-arrow-left mr-2"></i>Volver</a>
      </div>
    </div>
  </div>
</div>
