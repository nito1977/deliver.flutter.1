<div class="login-container">
  <div class="login-card">
    <div class="card-header">
      <div class="logo-container">
        <img src="../../assets/logoams.png" alt="Logo Federación">
      </div>
      <h2 class="login-title">F.S.P</h2>
      <p class="login-subtitle">Federación Sanjuanina de Patín</p>
    </div>

    <div class="card-body">
      <!-- Error Message -->
      <div class="alert alert-danger fade show" *ngIf="estatus">
        <i class="fa fa-exclamation-circle mr-2"></i> {{tituloEstatus}}
        <button type="button" class="close" (click)="estatus = false">
          <span>&times;</span>
        </button>
      </div>

      <!-- Success Message -->
      <div class="alert alert-success fade show" *ngIf="status">
        <i class="fa fa-check-circle mr-2"></i> {{mesagge}}
      </div>

      <form #loguinForm="ngForm" (ngSubmit)="ngSubmit()" autocomplete="off">
        
        <!-- Username Input -->
        <div class="form-group">
          <label for="nombre">Usuario</label>
          <div class="input-group">
            <i class="fa fa-user input-icon"></i>
            <input type="text" 
                   id="nombre"
                   name="nombre" 
                   #nombre="ngModel" 
                   [(ngModel)]="user.nombre"
                   class="form-control" 
                   placeholder="Ingrese su usuario"
                   required 
                   autofocus
                   [class.is-invalid]="nombre.touched && !nombre.valid">
          </div>
          <div *ngIf="nombre.touched && !nombre.valid" class="invalid-feedback">
            El usuario es requerido.
          </div>
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <label for="clave">Contraseña</label>
          <div class="input-group">
            <i class="fa fa-lock input-icon"></i>
            <input type="password" 
                   id="clave"
                   name="clave" 
                   #clave="ngModel" 
                   [(ngModel)]="user.clave"
                   class="form-control" 
                   placeholder="Ingrese su contraseña"
                   required
                   [class.is-invalid]="clave.touched && !clave.valid">
          </div>
          <div *ngIf="clave.touched && !clave.valid" class="invalid-feedback">
            La contraseña es requerida.
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" 
                class="btn btn-primary btn-login" 
                [disabled]="!loguinForm.form.valid || bloquear">
          <span *ngIf="!bloquear">Ingresar</span>
          <span *ngIf="bloquear">
            <i class="fa fa-spinner fa-spin mr-2"></i> Procesando...
          </span>
        </button>

      </form>
    </div>
  </div>
</div>
