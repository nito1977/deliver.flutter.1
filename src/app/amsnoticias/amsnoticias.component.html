<div class="container">
  <!--<h2>Noticias</h2>-->
    <div id="carouselExampleControls" class="carousel slide carousel-fade" data-ride="carousel">
      <ol class="carousel-indicators">
        <li data-target="#carouselExampleControls" data-slide-to="0" class="active"></li>
        <li data-target="#carouselExampleControls" data-slide-to="1"></li>
        <li data-target="#carouselExampleControls" data-slide-to="2"></li>
      </ol>
      <div class="carousel-inner">
        <div *ngFor="let noticias of listado;let j=index" [ngClass]="j==0 ?'carousel-item active' : 'carousel-item' ">
          <img class="d-block w-100" src="{{this.urlimgs}}/{{noticias.foto1}}" alt="{{noticias.foto1}}">
          <div class="p-1 bg-light"> {{noticias.titulo}}</div>
        </div>
      </div>
      
      <a class="carousel-control-prev" href="#carouselExampleControls" role="button" data-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="sr-only">Previous</span>
      </a>
      <a class="carousel-control-next" href="#carouselExampleControls" role="button" data-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="sr-only">Next</span>
      </a>
    
    </div>
</div>
