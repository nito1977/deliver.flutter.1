
<section class="carousel slide bg-light " data-ride="carousel" id="postsCarousel">


    <div class="container p-t-0 m-t-2 carousel-inner">
        <div class="d-flex bd-highlight mb-3">
            <div class="mr-auto pl-0 pt-3 bd-highlight"><h3 ><strong class="text-primary">Últimas</strong> noticias</h3></div>
            <div class="p-2 bd-highlight">
                <a class="btn btn-outline-secondary prev" href="" title="go back"><i class="fa fa-lg fa-chevron-left"></i></a>
            </div>
            <div class="p-2 bd-highlight">
                <a class="btn btn-outline-secondary next" href="" title="more"><i class="fa fa-lg fa-chevron-right"></i></a>
            </div>
          </div>

       <div class="row row-equal carousel-item active m-t-0 card-group ">
            <div *ngFor="let noticias of listado;let j=index" class="col-md-4">

                    <div class="card-img-top card-img-top-250">

                    </div>
                    <div class="card-body bg-white ">
                        <h6 class="small text-wide p-b-2 text-secondary">Categoría</h6>
                        <h5 class="card-title ">
                            <a class="text-dark" href>{{noticias.titulo}}</a>
                        </h5>
                        <p class="card-text text-dark">Resumen</p>
                    </div>
                </div>
            </div>
